<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008b91"><title>槓桿互動教具</title><link rel="stylesheet" href="style.css?v=9"></head>
<body><main><header><h1>槓桿互動教具</h1><button id="rotate-screen" aria-pressed="false">↻ 旋轉畫面</button></header><nav aria-label="功能"><button class="active" data-mode="force">力臂與力矩</button><button data-mode="weights">槓桿與砝碼實驗</button></nav><p class="rotate-hint">↻ 將手機或平板轉為橫向，觀察與操作更清楚</p><div class="workspace"><div class="stage"><section class="lab"><svg id="scene" viewBox="0 0 720 440" aria-label="可操作的槓桿" role="img"></svg></section><p id="hint" class="hint"></p></div><section id="force-controls" class="controls"><p class="force-instructions">拖曳箭頭端點調整力量與方向<br>力量範圍 5–20 N，每段 5 N</p><div class="actions"><button id="show" class="primary">計算力矩</button><button id="reset-force">重設</button></div><div id="result" hidden aria-live="polite"></div></section><section id="weight-controls" class="controls" hidden><div class="tray-heading"><h2>砝碼盒</h2><span id="remaining"></span></div><button id="tray" class="tray" aria-label="新增一個20公克砝碼"><span class="weight-icon">20 g</span><span>逐顆拖曳，放到刻度或串掛下方</span></button><div id="selection" hidden><span id="selected-label"></span><div class="actions"><button id="remove">移除</button></div></div><button id="reset-weights" class="wide">全部重設</button><p class="note">每個砝碼 20 g，共 20 個。傾斜角度僅作方向示意。</p></section></div></main><script src="app.js?v=12" type="module"></script></body></html>
